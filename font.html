<head>
    <style>
        body {
            font-family: Arial , sans-serif ;
            line-height: 1.5 ;
        }
        .tight{
            line-height: 15 ;
        }
        .loose{
            line-height: 1.8 ;
        }
        .light{
            line-height: 300;
        }
        .bold{
            font-weight: 900 ;
        }</style></head><body>
            <p class="tight">
                Tight line-height makes text harder to read when content is long.
            </p>
            <p class="loose">
                loose line-height improves readbility,especially for paragraphs,
            </p>
            <p class="light">
                light font weight is subtle and modern.
            </p>
            <p class="bold">
                bold font weight is good for emphasis.
            </p></body></html>
